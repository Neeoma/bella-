<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Bella Paint — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="admin">
  <div class="admin-login" id="login">
    <form class="form" id="loginForm">
      <a class="logo" href="index.html">Bella<span class="logo-dot"></span><small>Admin</small></a>
      <h1>Sign in</h1>
      <label>Password<input type="password" name="pass" autocomplete="current-password" required></label>
      <button class="btn btn-solid block" type="submit">Enter dashboard</button>
      <p class="form-msg error" id="loginMsg" role="alert"></p>
      <p class="fine">The password is set by the <b>ADMIN_PASSWORD</b> environment variable (default: <b>bella-admin</b> — change it before going live).</p>
    </form>
  </div>

  <div class="admin-shell" id="shell" hidden>
    <aside class="side">
      <a class="logo" href="index.html">Bella<span class="logo-dot"></span><small>Admin</small></a>
      <div id="tabs" style="display:contents"></div>
      <span class="spacer"></span>
      <a class="side-link" href="index.html">← View website</a>
      <button type="button" id="logout">Sign out</button>
    </aside>
    <main class="admin-main" id="view"></main>
  </div>

  <div class="overlay" id="overlay" hidden></div>
  <div class="modal" id="productModal" role="dialog" aria-modal="true" aria-labelledby="pmTitle" hidden>
    <div class="modal-box">
      <button class="icon-btn modal-close" id="pmClose" aria-label="Close">×</button>
      <h3 id="pmTitle">Product</h3>
      <form class="form" id="productForm" novalidate>
        <input type="hidden" name="id">
        <label>Name<input type="text" name="name" required></label>
        <div class="row">
          <label>Category
            <select name="category"><option>Interior</option><option>Exterior</option><option>Specialty</option><option>Tools</option></select>
          </label>
          <label>Finish<input type="text" name="finish"></label>
        </div>
        <label>Description<textarea name="desc" rows="2"></textarea></label>
        <label>Coverage<input type="text" name="coverage" placeholder="12 m² per litre"></label>
        <label>Sizes and prices (₦) — one per line, e.g. 4L: 32000
          <textarea name="sizes" rows="3" required></textarea>
        </label>
        <label style="display:flex;align-items:center;gap:10px"><input type="checkbox" name="tintable" style="width:auto"> Can be tinted to any Bella colour</label>
        <button class="btn btn-solid block" type="submit">Save product</button>
        <p class="form-msg error" id="pmMsg" role="alert"></p>
      </form>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
